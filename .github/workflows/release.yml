name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2022
    timeout-minutes: 20
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Get source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install build tools
        run: python -m pip install -r requirements-build.txt

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Set release version
        run: |
          $base = (Get-Content -LiteralPath VERSION -Raw).Trim()
          if ($base -notmatch '^(\d+)\.(\d+)\.(\d+)$') { throw 'Invalid VERSION file.' }
          $major = [int]$Matches[1]
          $minor = [int]$Matches[2]
          $patch = [int]$Matches[3] + [int]$env:GITHUB_RUN_NUMBER - 1
          $version = "$major.$minor.$patch"
          Set-Content -LiteralPath VERSION -Value $version -NoNewline -Encoding utf8
          "RELEASE_VERSION=v$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build executable
        run: python -m PyInstaller --noconfirm aoc-bind-presets.spec

      - name: Check executable
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP 'aoc-smoke\arena-of-champions'
          New-Item -ItemType Directory -Path $fixture -Force | Out-Null
          Copy-Item -LiteralPath 'tests\fixtures\settings.ron' -Destination (Join-Path $fixture 'settings.ron')
          $env:APPDATA = Split-Path -Path $fixture -Parent
          $report = Join-Path $env:GITHUB_WORKSPACE 'build\smoke-result.json'
          $exe = (Resolve-Path 'dist\AoC-bind-presets.exe').Path
          $process = Start-Process -FilePath $exe -ArgumentList @('--smoke-test', ('"' + $report + '"')) -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(30000)) {
            $process.Kill($true)
            throw 'The executable did not finish its startup check.'
          }
          if ($process.ExitCode -ne 0) {
            throw 'The executable failed its startup check.'
          }
          $result = Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
          $expectedBindings = @($result.bindings.PSObject.Properties).Count
          if ($result.status -ne 'ok' -or $result.class_buttons -ne 9 -or -not $result.initialised -or $expectedBindings -le 0 -or $result.binding_count -ne $expectedBindings) {
            throw 'The executable returned an unexpected startup result.'
          }

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # A rerun keeps the release already published by this workflow run.
          gh release view $env:RELEASE_VERSION --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Output "Release $env:RELEASE_VERSION already exists."
            exit 0
          }
          # A slower, older build must not replace a newer push as Latest.
          $head = gh api "repos/$env:GH_REPO/git/ref/heads/main" --jq '.object.sha'
          if ($LASTEXITCODE -ne 0) { throw 'Could not check the main branch.' }
          $latest = if ($head.Trim() -eq $env:GITHUB_SHA) { 'true' } else { 'false' }
          gh release create $env:RELEASE_VERSION 'dist/AoC-bind-presets.exe' --target $env:GITHUB_SHA --title $env:RELEASE_VERSION --generate-notes "--latest=$latest"
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish the release.' }
